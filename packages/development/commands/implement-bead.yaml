metadata:
  name: ensemble:implement-bead
  description: Implement one bead by ID on a feature branch using the same branching and commit policy as beads-build and implement-trd-beads, opening its change request through the configured host adapter
  version: 2.3.0
  lastUpdated: "2026-10-23"
  category: implementation
  output_path: ensemble/implement-bead.md
  source: sunstone
  model: medium
  argument_hint: "<bead-id> [--foreman]"
  capabilities:
    required:
      - tracker.show
      - tracker.set-status
      - tracker.close
      - tracker.comment
      - host.change-request-create
      - workflow.branch-create
      - workflow.status
      - workflow.commit
      - workflow.push
    optional:
      - tracker.sync
  allowed_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - Task
  examples:
    - '/ensemble:implement-bead beads-042'
    - '/ensemble:implement-bead 42'

# Skill-backed command: the prompt is packages/development/skills/ensemble-implement-bead/SKILL.md,
# the single source of truth. Edit the skill, not this manifest.
skill: ensemble-implement-bead
