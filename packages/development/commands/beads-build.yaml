metadata:
  name: ensemble:beads-build
  description: Drive an existing bead hierarchy to completion through the full builder, code-review, and close pipeline
  version: 1.4.0
  lastUpdated: "2026-10-23"
  category: implementation
  output_path: ensemble/beads-build.md
  source: sunstone
  model: medium
  capabilities:
    required:
      - tracker.show
      - tracker.list
      - tracker.comment
      - tracker.close
      - work-graph.ready
      - workflow.status
      - workflow.remote-url
      - workflow.commit
    optional:
      - work-graph.plan
      - tracker.comments
      - tracker.sync
      - host.change-request-create
      - workflow.push
      - workflow.diff
  argument_hint: "[epic-id|slug-pattern | --epic <id>] [--max-parallel N | max parallel N] [--trd trd-path] [--strategy tdd|characterization|bug-fix|refactor|test-after|flexible] [--label <label>] [--defer-completion] [--plan]"
  allowed_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - Task

# Skill-backed command: the prompt is packages/development/skills/ensemble-beads-build/SKILL.md,
# the single source of truth. Edit the skill, not this manifest.
skill: ensemble-beads-build
