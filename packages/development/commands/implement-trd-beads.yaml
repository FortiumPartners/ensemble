metadata:
  name: ensemble:implement-trd-beads
  description: Implement TRD with beads project management — persistent bead hierarchy, dependency-aware execution via toolchain-cli tracker/work-graph capabilities, and cross-session resumability
  version: 3.2.0
  lastUpdated: "2026-10-21"
  category: implementation
  output_path: ensemble/implement-trd-beads.md
  source: sunstone
  model: medium
  capabilities:
    required:
      - tracker.list
      - tracker.create
      - tracker.comment
      - tracker.close
      - test-runner.run
      - package-runner.run-script
      - workflow.commit
      - workflow.merge-base
    optional:
      - work-graph.plan
      - work-graph.graph-health
      - tracker.stage-export
      - tracker.comments
      - tracker.dep-add
      - tracker.sync
  argument_hint: "[trd-path] [--plan] [--execute] [--branch=<name>] [--use-current-branch] [--status] [--reset-task TRD-XXX] [--list] [max parallel N] [--foreman] [<trd-path> <trd-path>... --workstream [--generate-only [--out <path>] [--allow-invalid]]]"
  allowed_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - Task

# Skill-backed command: the prompt is packages/development/skills/ensemble-implement-trd-beads/SKILL.md,
# the single source of truth. Edit the skill, not this manifest.
skill: ensemble-implement-trd-beads
