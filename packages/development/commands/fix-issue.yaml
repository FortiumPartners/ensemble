metadata:
  name: ensemble:fix-issue
  description: Lightweight workflow for bug fixes and small issues
  version: 1.4.0
  lastUpdated: "2026-10-14"
  category: implementation
  model: medium
  output_path: ensemble/fix-issue.md
  source: sunstone

parameters:
  - name: description
    type: string
    required: false
    description: Issue description (free text or omit if using --issue)

  - name: issue
    type: number
    required: false
    description: GitHub issue number (e.g., --issue 34)

  - name: branch
    type: string
    required: false
    description: Custom branch name (default auto-generated)

  - name: skip-tests
    type: boolean
    default: false
    description: Skip test validation (not recommended)

  - name: draft-pr
    type: boolean
    default: false
    description: Create draft PR instead of ready-for-review

  - name: interactive
    type: boolean
    default: false
    description: Enable detailed user interviews during planning

  - name: foreman
    type: boolean
    default: false
    description: |
      Run in Foreman-native non-interactive mode -- skip the user interview step and always auto-commit + create the PR without pausing for confirmation (for automated Foreman orchestration).

      When --foreman is present and the FOREMAN_ARTIFACT_PATH environment
      variable is set and non-empty, write the phase report to that exact
      path (creating parent directories as needed) IN ADDITION TO any
      repo-local report this command already writes. Foreman computes that
      path and reads it back to confirm the phase produced an artifact;
      writing only to a repo-local convention leaves Foreman with no
      artifact. Never invent, alter, or relocate the path. Never treat an
      unset FOREMAN_ARTIFACT_PATH as an error — outside Foreman dispatch
      it is simply absent, and behavior must be unchanged.

  - name: status
    type: boolean
    default: false
    description: Show the active/most-recent issue run's stage, outcome, and references without advancing it.

  - name: abandon
    type: boolean
    default: false
    description: Abandon the project's active/paused issue run after explicit confirmation.

constraints:
  - GitHub only (no GitLab/Bitbucket in v1.0)
  - GitHub CLI (gh) must be installed and authenticated
  - Tests must pass unless --skip-tests flag is used
  - Maximum 2 auto-fix attempts for test failures
  - User interview limited to 5 questions maximum
  - Branch naming follows fixed convention (customizable via --branch)
  - When --foreman is set, the user interview step is force-skipped and PR creation always proceeds without pausing for confirmation
  - 'When --foreman is present and FOREMAN_ARTIFACT_PATH is set and non-empty, write the phase report to that exact path (creating parent directories as needed) IN ADDITION TO any repo-local report this command already writes -- Foreman computes that path and reads it back to confirm the phase produced an artifact. Never invent, alter, or relocate the path, and never treat an unset FOREMAN_ARTIFACT_PATH as an error (outside Foreman dispatch it is simply absent and behavior is unchanged).'

mission:
  summary: |
    Orchestrate a complete bug fix workflow from analysis to PR creation,
    assembling a virtual team of specialized agents (Product Manager, Tech Lead,
    Architect, QA Lead) to ensure high-quality fixes with minimal user intervention.
    Resumable and checkpointed (REQ-019): a run's stage and outcome are
    recorded via issue-run-index.ts after each of the 3 named phases, so a
    later invocation can resume, report status, or abandon it instead of
    re-deriving progress from conversation history.
    --foreman also carries an artifact contract: when FOREMAN_ARTIFACT_PATH is set
    and non-empty, write the phase report to that exact path (creating parent
    directories as needed) IN ADDITION TO any repo-local report this command
    already writes -- Foreman computes that path and reads it back to confirm the
    phase produced an artifact. Never invent, alter, or relocate the path, and
    never treat an unset FOREMAN_ARTIFACT_PATH as an error (outside Foreman
    dispatch it is simply absent and behavior is unchanged).

  behavior:
    - Execute 4-phase workflow - Entry Point Resolution, Analysis & Planning, Execution, Validation & Delivery
    - Resolve the entry point from description/issue/no-arg/--status/--abandon, mirroring ensemble:new-feature's own entry-point resolution pattern (AC-019-2)
    - Checkpoint progress via issue-run-index.ts after each of the 3 named phases completes, enabling resume/--status/--abandon across sessions (REQ-019)
    - Delegate codebase analysis to general-purpose agent (Haiku for speed)
    - Assemble 4-agent team for collaborative planning (Sonnet for quality)
    - Conduct user interview only if description is ambiguous or --interactive flag set (never when --foreman is set)
    - When --foreman is set, run fully non-interactively - skip the user interview, never pause for confirmation, and always auto-commit and open a PR
    - Create git branch following convention - fix/issue-{num}-{slug}
    - Generate actionable task list and track progress with TodoWrite
    - Delegate implementation to appropriate agents (backend, frontend, infrastructure)
    - Run test suite with auto-fix retry logic (max 2 attempts)
    - Run an independent local review and one batched fix pass before any commit, push, or PR is created, gating `prApprovedAt` on `LOCAL_REVIEW_COMPLETE` (REQ-011)
    - Create comprehensive PR with GitHub CLI
    - After the PR is published, evaluate the head-bound remote CodeRabbit review before reporting success; a pending or blocked review returns a resumable report instead of a false completion (REQ-012, REQ-013)
    - Provide clear error messages and recovery guidance

workflow:
  phases:
    - name: Entry Point Resolution
      order: 1
      description: >-
        Determine, from description/issue/no-arg/--status/--abandon,
        whether this invocation starts a new run, resumes an existing
        one, reports its status read-only, or abandons it -- mirroring
        ensemble:new-feature's own entry-point resolution pattern
        (AC-019-1, AC-019-2).

      steps:
        - order: 1
          title: Start New Run or Resume Active Run
          description: |
            A `description` or `issue` argument with no active run for
            the project starts a fresh run at stage analysis_planning.
            With neither argument (and no --status/--abandon), resume
            the project's active/paused run from its last recorded
            checkpoint, after two gates. A run parked by failure asks
            "Retry <stage>?" and only an explicit yes re-executes it. A
            run at stage validation_delivery whose stageOutcome is
            approval_wait with a REVIEW_ detail is a pending or blocked
            remote review: it resumes at Remote Review Disposition,
            never at Test Validation, and never re-runs Local Review
            and Batch Fix or PR Creation. That step reads the PR URL
            from the run's recorded `pr:` beadRef; with none recorded
            it halts and tells the user to find or supply the PR URL
            instead of restarting.
          tool: Bash
          instructions: |
            1. IF `description` or `issue` is provided:
               - Call IssueRunIndexStore.createRun(projectRoot, issueDescription)
                 (issueDescription is `description`, or the GitHub issue
                 body fetched via `gh issue view` when `issue` is given
                 instead) (AC-019-1).
               - createRun() enforces single-active-run exclusivity at
                 create time: if it throws RUN_ALREADY_ACTIVE, print "An
                 issue run is already active for this project:
                 <existingRunId>. Resume it with no arguments (or
                 --status to inspect it first), or --abandon it before
                 starting a new one." and stop -- no new run is created.
               - Otherwise print the new run's identifier and that it
                 starts at stage analysis_planning; proceed to Analysis
                 & Planning below.
            2. ELSE (no `description`, `issue`, `status`, or `abandon`
               argument given): call
               IssueRunIndexStore.findActive(projectRoot).
               - If no active run: print "No issue run found for this
                 project. Start one with --issue <number> or a free-text
                 description." Stop here.
               - If an active run is found and its stageOutcome.kind is
                 "failure": this is a paused-by-failure run (TRD-010,
                 REQ-014) -- print the parked stage and recorded failure
                 detail, then ask the user (AskUserQuestion or
                 equivalent) "Retry <stage>? [yes/no]". Do NOT resume
                 execution on a bare invocation alone. Only an explicit
                 "yes" proceeds to re-execute that stage; "no" or no
                 response stops here with stage/stageOutcome/revision
                 completely unchanged -- no automatic retry,
                 background scheduling, or unattended continuation ever
                 occurs (AC-014-1).
               - If an active run is found and its stage is
                 "validation_delivery", its stageOutcome.kind is
                 "approval_wait", and its stageOutcome.detail starts with
                 "REVIEW_": this is a resumable pending/blocked
                 remote-review disposition (TRD-010, REQ-012, AC-012-2)
                 -- call IssueRunIndexStore.loadRun(projectRoot, runId)
                 and jump directly to Validation & Delivery's Remote
                 Review Disposition step; do NOT re-run Test Validation,
                 Local Review and Batch Fix, or PR Creation (so a bare
                 invocation never opens a second PR for the same branch).
                 That step reads its PR_URL from the recorded `pr:` beadRef;
                 a run with none recorded (for example one parked by the
                 no-PR-URL halt) takes the same jump and that step HALTs it
                 with a clear message to find or supply the PR URL -- a
                 missing `pr:` entry never sends the run back to Test
                 Validation.
               - If an active run is found and its stageOutcome.kind is
                 anything else ("success", "pending", or a freshly
                 created run that has never run a stage yet): no
                 confirmation gate applies -- call
                 IssueRunIndexStore.loadRun(projectRoot, runId) and
                 resume execution at its recorded `stage`, from that
                 stage's first step (AC-019-2) -- never re-derive
                 progress from conversation history or file-presence
                 guessing alone.

        - order: 2
          title: "--status -- Read-Only Run Report"
          description: |
            Report the active/most-recent run's stage, outcome, and
            references without advancing it. No stage executes and no
            mutate() call is made regardless of what is found (AC-019-3).
          conditional: true
          trigger: --status flag is set
          instructions: |
            1. Call IssueRunIndexStore.findActive(projectRoot).
            2. IF no run found: print "No issue runs found for this
               project." Stop here.
            3. IF found: print the run identifier, current stage, last
               stageOutcome.kind (with detail, when pending or a
               failure), and every recorded artifacts[] and beadRefs[]
               reference. If status is "completed" or "abandoned", state
               that terminal outcome explicitly alongside the retained
               references.
            4. Make no mutate() call -- viewing this report never
               advances or alters the run.

        - order: 3
          title: "--abandon -- Explicit Confirmation Required"
          description: |
            Terminate the project's active/paused run after explicit
            confirmation; the run reaches a terminal abandoned state
            with its history retained (AC-019-4, AC-007-3).
          conditional: true
          trigger: --abandon flag is set
          instructions: |
            1. Call IssueRunIndexStore.findActive(projectRoot).
            2. IF no active run: print "No active issue run exists to
               abandon." Stop here.
            3. IF found: print the run's current stage and ask the user
               "Abandon issue run <runId> at stage <stage>? [yes/no]" via
               AskUserQuestion. Only an explicit "yes" reaches Step 4 --
               a "no" or non-response leaves the run completely
               unchanged.
            4. On explicit "yes": call
               IssueRunIndexStore.abandon(projectRoot, runId, reason)
               (reason defaults to "User abandoned run" when none is
               given), setting the run to its terminal "abandoned"
               status and releasing active.lock. The run's own history
               file is never deleted -- a later --status check still
               shows the abandoned outcome and retained references.
            5. On decline/no response: perform no mutate() call; the run
               stays exactly as it was before this invocation.

    - name: Analysis & Planning
      order: 2
      description: Understand codebase context and create comprehensive fix plan

      steps:
        - order: 1
          title: Codebase Analysis
          description: |
            Explore codebase to identify affected files, patterns, and scope.
            Use Grep, Glob, and Read tools to understand context.
          agent: general-purpose
          model: low
          instructions: |
            1. Extract keywords from issue description
            2. Search codebase for relevant files (Grep)
            3. Identify related test files
            4. Detect framework and testing patterns (package.json, imports)
            5. Estimate scope (file count, estimated LOC)
            6. Return structured analysis result

        - order: 2
          title: Collaborative Planning
          description: |
            Assemble virtual team of 4 specialized agents to create comprehensive
            fix plan with multiple perspectives.
          model: medium
          instructions: |
            Delegate planning to 4 agents in sequence:

            1. Task(product-management-orchestrator)
               - Validate problem statement
               - Define acceptance criteria
               - Identify user impact and edge cases

            2. Task(tech-lead-orchestrator)
               - Review technical approach
               - Ensure consistency with codebase patterns
               - Validate feasibility

            3. Task(infrastructure-orchestrator)
               - Evaluate architecture implications
               - Identify dependencies and integration points
               - Assess scalability and maintainability

            4. Task(qa-orchestrator)
               - Define test coverage requirements
               - Create test strategy
               - Identify quality gates

            Synthesize responses into unified plan with:
            - Approach summary
            - Files to modify
            - Test strategy
            - Edge cases to handle

        - order: 3
          title: User Interview (Conditional)
          description: |
            If issue description is ambiguous or --interactive flag is set,
            ask clarifying questions ONE AT A TIME (max 5) -- never batch questions.
            Use AskUserQuestion for each. Wait for each answer before asking the next.
          conditional: true
          trigger: |
            IF --foreman flag is set: ALWAYS force-skip this step entirely -- never ask
            questions, even if ambiguity conditions below would otherwise trigger it.
            There is no human present to answer in Foreman-native automated execution.

            Otherwise, Ambiguity detection:
            - Description < 20 words
            - Vague terms ("doesn't work", "broken", "issue")
            - Multiple possible interpretations
            - OR --interactive flag is set
          instructions: |
            0. IF --foreman flag is set: skip this entire step (do not ask any questions)
               and proceed directly to Execution phase using best-effort assumptions.
            1. Identify up to 5 focused clarifying questions
            2. Ask them ONE AT A TIME using AskUserQuestion -- never batch or list multiple questions
            3. Wait for each answer before asking the next
            4. Incorporate responses into plan and update approach and acceptance criteria

        - order: 4
          title: Record Stage Checkpoint
          description: |
            Persist this phase's outcome and advance the run to the next
            stage via issue-run-index.ts (Implementation AC 2, REQ-019).
          tool: Bash
          instructions: |
            1. Call IssueRunIndexStore.mutate(projectRoot, runId, revision,
               (record) => { record.artifacts.push({ type: "fix-plan",
               path: <fix plan output path>, recordedAt: now() });
               record.stage = "execution"; record.stageOutcome = { kind:
               "success", recordedAt: now() }; }) in a single call to
               record this phase's fix-plan artifact and advance the run's
               stage from analysis_planning to execution together --
               calling mutate() twice with the same `revision` would make
               the second call always throw REVISION_CONFLICT against the
               first call's own bump, so both changes belong in one
               callback.
            2. On a thrown error (e.g. a revision conflict), halt the
               workflow and report the error -- do not proceed to
               Execution with an unrecorded checkpoint.

    - name: Execution
      order: 3
      description: Create branch, generate tasks, and implement fix

      steps:
        - order: 1
          title: Branch Creation
          description: Create git branch with conventional naming
          tool: Bash
          instructions: |
            1. Generate branch name:
               - IF --branch flag: Use custom name
               - ELIF --issue flag: fix/issue-{number}-{slugified-description}
               - ELSE: fix/{slugified-description}

            2. Check if branch exists:
               - git branch --list {branch-name}
               - If exists: Ask user to switch or use different name

            3. Create branch:
               - git checkout -b {branch-name}
               - Verify creation: git branch --show-current

        - order: 2
          title: Task List Generation
          description: Break down plan into actionable tasks
          tool: TodoWrite
          instructions: |
            Generate 3-10 specific, actionable tasks from plan:

            Format:
            - content: "Update timeout.ts constant from 30s to 60s"
              activeForm: "Updating timeout constant"
              status: "pending"

            Include:
            - Implementation tasks (file modifications)
            - Test update tasks
            - Validation tasks

            Each task should be:
            - Specific to a file or component
            - Actionable (clear what to do)
            - Testable (clear success criteria)

        - order: 3
          title: Task Execution
          description: |
            Execute all tasks with appropriate agent delegation and
            real-time progress tracking.
          model: medium
          instructions: |
            FOR EACH task in task list:

            1. Mark task as in_progress:
               TodoWrite({ taskId: X, status: "in_progress" })

            2. Select appropriate agent:
               - Backend code → backend-developer
               - Frontend code → frontend-developer
               - Infrastructure → infrastructure-developer
               - Generic → general-purpose

            3. Delegate task:
               Task(agent-type, prompt=task.content)

            4. Mark task as completed:
               TodoWrite({ taskId: X, status: "completed" })

            5. IF task fails:
               - Keep status as "in_progress"
               - Log error details
               - Continue with remaining tasks
               - Report failures at end

        - order: 4
          title: Record Stage Checkpoint
          description: |
            Persist this phase's outcome and advance the run to the next
            stage via issue-run-index.ts (Implementation AC 2, REQ-019).
          tool: Bash
          instructions: |
            1. Call IssueRunIndexStore.mutate(projectRoot, runId, revision,
               (record) => { record.stage = "validation_delivery";
               record.stageOutcome = { kind: "success", recordedAt: now() };
               }) to advance the run's stage from execution to
               validation_delivery.
            2. On a thrown error (e.g. a revision conflict), halt the
               workflow and report the error -- do not proceed to
               Validation & Delivery with an unrecorded checkpoint.

    - name: Validation & Delivery
      order: 4
      description: Validate tests pass and create pull request

      steps:
        - order: 1
          title: Test Validation
          description: |
            Run test suite with auto-fix retry logic. Ensure all tests
            pass before creating PR.
          agent: test-runner
          model: low
          retry: 2
          instructions: |
            1. Detect test framework:
               - Check package.json for jest, pytest, rspec, etc.
               - Check for test files and imports
               - Determine test command (npm test, pytest, rspec)

            2. Run tests (Attempt 1):
               - Bash({test-command})
               - Parse output for pass/fail

            3. IF tests fail:
               - Analyze failure output
               - Identify root causes
               - Attempt fixes (Edit files)
               - Run tests again (Attempt 2)

            4. IF tests still fail after 2 attempts:
               - Report failures to user with details
               - Call IssueRunIndexStore.mutate(projectRoot, runId, revision,
                 (record) => { record.stageOutcome = { kind: "failure", detail:
                 <failure summary>, recordedAt: now() }; }) to persist this as
                 a paused-by-failure run at the CURRENT stage
                 (validation_delivery) -- do not advance `stage` (TRD-010,
                 AC-014-1). This is what lets a later bare invocation's Entry
                 Point Resolution gate the resume behind an explicit "Retry
                 <stage>?" confirmation instead of silently re-running Test
                 Validation.
               - HALT workflow (do not create PR)
               - Provide recovery instructions
               - prApprovedAt stays null, so PR Creation remains denied if
                 ever reached (TRD-019, AC-014-2)

            5. IF --skip-tests flag:
               - Log warning message
               - Skip test execution
               - Proceed to Local Review and Batch Fix

            6. On tests passing (Attempt 1, Attempt 2, or --skip-tests):
               proceed to Local Review and Batch Fix. This step no longer
               sets prApprovedAt itself -- the Local Review and Batch Fix
               step alone does, once it reaches LOCAL_REVIEW_COMPLETE
               (TRD-009, AC-011-2).

        - order: 2
          title: Local Review and Batch Fix
          description: |-
            Independent local review of the complete diff, triage, and one
            batched fix pass -- before any commit, push, or PR creation
            (TRD-009, REQ-011). Invokes the shared pr-review-cycle skill,
            located at
            "$(git rev-parse --show-toplevel 2>/dev/null)/packages/development/skills/pr-review-cycle/SKILL.md",
            in pre-publication (local) mode; that skill composes
            pr-review-remediation for the actual fixes and does not
            restate its triage/test/minimal-fix rules here.
            Fail-closed gate: only a returned localPhase of exactly
            LOCAL_REVIEW_COMPLETE proceeds to PR Creation, and only that
            outcome sets prApprovedAt (COMPLETE already accounts for the
            test results, so this step grades nothing itself). EVERY other
            outcome -- LOCAL_REVIEW_PENDING, LOCAL_REVIEW_BLOCKED, a
            missing or unparseable result, or the skill returning nothing
            (for example pr-review-remediation not installed) -- leaves
            prApprovedAt null, records a failure stageOutcome at the
            current stage, writes the { status, headSha, ledger } report to
            the exact FOREMAN_ARTIFACT_PATH first when --foreman is set and
            that variable is non-empty, and only then HALTs with nothing
            committed, pushed, or published. The reviewed head is a
            snapshot commit of the working tree that includes untracked
            files, built from a temporary index (never git stash create),
            and it is re-resolved after the batch fix, before the
            re-review. The tree of that post-fix snapshot (git rev-parse
            '<SNAPSHOT_HEAD>^{tree}') is recorded as reviewedTreeSha, so
            Remote Review Disposition can recognise the real commit PR
            Creation makes -- a different SHA, the same content -- by its
            tree.
          model: medium
          instructions: |
            1. Resolve the review scope against the real PR base -- never a
               guessed one:
               - DEFAULT_BRANCH: git symbolic-ref --short
                 refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@',
                 falling back to "main" if empty or the command fails.
               - BASE_SHA: git merge-base HEAD <DEFAULT_BRANCH>.
               - SNAPSHOT_HEAD (the value used for HEAD_SHA): the Execution
                 phase's changes are not committed yet (PR Creation still
                 owns the one real commit, unchanged), and they often
                 include new files git does not track yet -- `git stash
                 create` omits those, so it is NOT used. Resolve a real,
                 diffable SHA covering tracked changes AND untracked
                 (non-ignored) files, without touching the real index or
                 working tree and without creating or advancing any branch,
                 by building the snapshot in a TEMPORARY index at a path
                 that does not exist yet (an existing 0-byte file is not a
                 valid index). The command's output is the SHA:

                 ```sh
                 SNAP_DIR=$(mktemp -d) && SNAP_INDEX="$SNAP_DIR/index" &&
                 GIT_INDEX_FILE="$SNAP_INDEX" git read-tree HEAD &&
                 GIT_INDEX_FILE="$SNAP_INDEX" git add -A &&
                 SNAP_TREE=$(GIT_INDEX_FILE="$SNAP_INDEX" git write-tree) &&
                 rm -rf "$SNAP_DIR" &&
                 if [ "$SNAP_TREE" = "$(git rev-parse 'HEAD^{tree}')" ]; then
                   git rev-parse HEAD
                 else
                   GIT_AUTHOR_NAME=ensemble GIT_AUTHOR_EMAIL=ensemble@localhost \
                   GIT_COMMITTER_NAME=ensemble GIT_COMMITTER_EMAIL=ensemble@localhost \
                   GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z \
                   git commit-tree "$SNAP_TREE" -p HEAD -m 'ensemble: local review snapshot'
                 fi
                 ```

                 `git add -A` only ever targets that temporary index; PR
                 Creation's "never use git add -A" rule is about staging in
                 the real index and is unchanged. The identity and dates are
                 fixed so the SHA is a pure function of HEAD and the tree:
                 an unchanged tree resolves to the same SHA every time, any
                 change resolves to a different one, and a clean tree
                 (nothing beyond HEAD to review) resolves to HEAD itself.

            2. Invoke the pr-review-cycle skill (via the skill system) with
               MODE='local', BASE_SHA=<resolved above>, HEAD_SHA=<SNAPSHOT_HEAD
               resolved above>, REVIEWED_TREE_SHA=<git rev-parse
               '<SNAPSHOT_HEAD>^{tree}'>, PR_ID=<repo-slug>-<branch-name> (no PR
               number exists yet), TEST_COMMAND=<the test command detected by
               Test Validation>, SKIP_TESTS=<true when --skip-tests was passed>,
               FOREMAN=<--foreman flag>. The batch fix changes the working
               tree, so the skill's post-batch head re-resolution is a fresh
               run of SNAPSHOT_HEAD, taken after the batch fix and BEFORE
               the re-review -- never `git rev-parse HEAD`, which cannot see
               uncommitted work and would leave the review bound to the
               pre-fix tree. Tell the skill so when invoking it: that
               post-fix SNAPSHOT_HEAD is the end of the re-review range and
               the value of both headSha and reviewedHeadSha; its tree (`git
               rev-parse '<SNAPSHOT_HEAD>^{tree}'` of that post-fix value) is
               the value of REVIEWED_TREE_SHA, recorded as reviewedTreeSha in
               the review-state report; and a review bound to the pre-fix
               snapshot or its tree is stale and cannot complete. The
               synthetic snapshot commit is never pushed: PR Creation makes
               the one real commit, with a different SHA, and the recorded
               tree is what lets Remote Review Disposition recognise that
               commit as the content that was reviewed.

            3. --skip-tests never skips this step: SKIP_TESTS is passed
               through to the skill, which records tests.skipped=true and
               the exact test command, and the overall review status is
               never REVIEW_COMPLETE while tests were skipped -- it is
               REVIEW_PENDING with reason "tests skipped" (TRD-009,
               AC-014-1, AC-014-2). The PR may still be created once
               LOCAL_REVIEW_COMPLETE is reached.

            4. Parse the skill's return value {status, localPhase, reasons,
               ledger, reportPath, headSha}. Store localPhase as
               LOCAL_PHASE -- null when the skill returned nothing, the
               value is unparseable, or it carries no localPhase (for
               example pr-review-remediation is not installed, which the
               skill reports as REVIEW_BLOCKED with no phase) -- and store
               status as LOCAL_STATUS, reportPath as
               LOCAL_REVIEW_REPORT_PATH and headSha as REVIEWED_HEAD_SHA.

            5. IF LOCAL_PHASE == 'LOCAL_REVIEW_COMPLETE': this is the ONLY
               value that proceeds, and it already accounts for the test
               results (passed, or explicitly skipped under --skip-tests),
               so apply no further grading here. Call
               IssueRunIndexStore.mutate(projectRoot, runId, revision,
               (record) => { record.prApprovedAt = now(); }) to record this
               workflow's own local-review-pass gate as the
               store-persisted-approval checkpoint (TRD-009, AC-011-2). Test
               Validation no longer sets prApprovedAt -- this item alone
               does, and it runs for no other value. Proceed to PR Creation.

            6. OTHERWISE -- LOCAL_PHASE is anything other than exactly
               'LOCAL_REVIEW_COMPLETE': that covers LOCAL_REVIEW_PENDING and
               LOCAL_REVIEW_BLOCKED, a null, undefined or unrecognised
               value, and a missing or unparseable result. It is a blocked
               outcome, never a pass. Do NOT call mutate() to set
               prApprovedAt -- it stays null, so PR Creation's existing
               "read prApprovedAt directly, null denies" precondition denies
               the call with no commit, push or PR even if reached. Call
               IssueRunIndexStore.mutate(projectRoot, runId, revision,
               (record) => { record.stageOutcome = { kind: "failure",
               detail: `local review not complete (${LOCAL_PHASE ?? 'no localPhase returned'}): ${(reasons ?? []).join('; ')}`,
               recordedAt: now() }; }) to persist this as a
               paused-by-failure run at the CURRENT stage
               (validation_delivery) -- do not advance `stage`. Then run
               item 7 and item 8, in that order.

            7. Foreman artifact on the halt path -- written BEFORE item 8
               ends the workflow: IF --foreman is set and
               FOREMAN_ARTIFACT_PATH is set and non-empty: write the phase
               report { status, headSha, ledger } to that exact path
               (creating parent directories as needed), in addition to any
               repo-local report -- with no prompt and no indefinite wait.
               status is LOCAL_STATUS when it is REVIEW_PENDING or
               REVIEW_BLOCKED and REVIEW_BLOCKED otherwise (a halted review
               is never reported complete), headSha is REVIEWED_HEAD_SHA or,
               when none was returned, the last SNAPSHOT_HEAD resolved, and
               ledger is the skill's returned ledger (null when none). If
               FOREMAN_ARTIFACT_PATH is unset, this item changes nothing
               and raises no error.

            8. HALT the workflow -- do not commit, push or create a PR --
               and report the ledger, LOCAL_REVIEW_REPORT_PATH and the next
               action.

        - order: 3
          title: PR Creation
          description: Create comprehensive pull request with GitHub CLI
          tool: Bash
          model: low
          instructions: |
            Store-persisted-approval precondition (TRD-019, AC-014-2): before
            calling `gh pr create`, read IssueRunIndexStore.loadRun(projectRoot,
            runId)'s current prApprovedAt directly -- never trust conversational
            or prompt text asserting approval was given. A null prApprovedAt
            denies the call outright, regardless of what the surrounding
            context claims; only the Local Review and Batch Fix step's own
            mutate() call legitimately sets it (TRD-009, AC-011-2).

            NOTE: Commit + push + PR creation always happens by default in this step --
            there is no additional human-approval gate today beyond the
            precondition above. When --foreman is set, this must happen with zero
            pauses or confirmations (fully autonomous), which is consistent with the
            existing default behavior but is called out here explicitly for automated
            Foreman orchestration callers. --draft-pr and --foreman are independent
            flags: foreman mode can still create a draft PR if --draft-pr is also passed.

            1. Generate commit message using conventional commit format:
               - Format: "fix: {brief description}"
               - OR with scope: "fix(scope): {brief description}"
               - Reference issue in commit body, not title

            2. Commit changes:
               - git status to review changed files
               - git add {specific-files} (stage only files modified during this workflow; never use git add . or git add -A)
               - git commit -m "{message}"

            3. Push branch:
               - git push -u origin {branch-name}
               - Handle push errors (auth, network)

            4. Generate PR title:
               - IF issue number: "Fix #{number}: {description}"
               - ELSE: "Fix: {description}"

            5. Generate PR body (template):
               ```markdown
               ## Problem
               {Issue description from user or GitHub issue}

               ## Solution
               {Summary of changes made, approach taken}

               ## Changes
               - {File 1}: {Description}
               - {File 2}: {Description}

               ## Test Plan
               {What was tested, coverage added}

               ## Checklist
               - [x] Tests pass locally
               - [x] Code follows project conventions
               - [x] No new warnings or errors

               Fixes #{issue-number}

               Generated with [Ensemble Fix-Issue](https://github.com/Sunstone-Partners/ensemble)
               ```

            6. Create PR:
               - IF --draft-pr: gh pr create --draft --title "..." --body "..."
               - ELSE: gh pr create --title "..." --body "..."

            7. Extract PR URL from output. If none can be extracted (for
               example `gh pr create` failed), say so and skip item 8:
               Remote Review Disposition item 1 owns the no-PR-URL block.

            8. Display to user, only when item 7 found a PR URL:
               - "✓ PR created: {url}"
               - "✓ Branch pushed: {branch-name}"
               - "✓ All tests passed"

        - order: 4
          title: Remote Review Disposition
          description: |-
            After the PR exists: first record its URL once as a
            `pr:<url>` beadRef on the run (only when that exact entry is
            not already present, and never `pr:undefined`) so a later
            resume can find the PR; then invoke the shared pr-review-cycle
            skill, located at
            "$(git rev-parse --show-toplevel 2>/dev/null)/packages/development/skills/pr-review-cycle/SKILL.md",
            in remote mode to evaluate the head-bound CodeRabbit review and
            decide whether this run may report success (TRD-010, REQ-012,
            REQ-013). Pass it HEAD_SHA (git rev-parse HEAD) and
            HEAD_TREE_SHA (git rev-parse 'HEAD^{tree}'): PR Creation's real
            commit is not the snapshot Local Review bound its review to, so
            the review is fresh only when HEAD_SHA equals the reviewed head
            or HEAD_TREE_SHA equals the reviewedTreeSha Local Review
            recorded -- a different tree is stale, never complete. A
            pending or blocked review never completes the run
            -- it returns a resumable report instead (a later bare
            invocation resumes at this step, not at "done"). Only exactly
            REVIEW_COMPLETE proceeds to Record Stage Checkpoint; EVERY
            other outcome (REVIEW_PENDING, REVIEW_BLOCKED, null,
            unrecognised, missing or unparseable) records approval_wait and
            HALTs without calling complete(). On resume PR_URL is read from
            the record's `pr:` beadRef. With no PR URL (PR Creation
            extracted none, or the resumed record has no `pr:` beadRef) the
            skill is not invoked: the step takes that same blocked path --
            REVIEW_BLOCKED, approval_wait with the detail "REVIEW_BLOCKED: no PR URL recorded",
            the Foreman artifact first, then HALT -- and never restarts at
            Test Validation or re-runs PR Creation. Under --foreman
            with FOREMAN_ARTIFACT_PATH set and non-empty, the report
            { status, headSha, ledger } is written to that exact path for
            EVERY status, before any halt; with the variable unset, behavior
            is unchanged. Foreman mode never prompts and never waits
            indefinitely.
          tool: Bash
          model: low
          instructions: |
            1. Establish PR_URL. On a fresh run PR_URL is the URL PR
               Creation extracted from the `gh pr create` output. On a
               RESUMED run (the resume gate jumped here without executing
               PR Creation) PR_URL is READ from the record's existing
               `pr:`-prefixed beadRefs[] entry (the last one when there are
               several; strip the prefix). Only a PR URL proceeds: the
               trimmed value must match `^https?://\S+/pull/[0-9]+$`.
               Anything else -- empty, whitespace, undefined, null, no `pr:`
               entry, or text that is not such a URL -- is "no PR URL".
               Never proceed with an undefined URL, never write a
               `pr:undefined` entry, and never re-run PR Creation (the PR
               may already exist).
               - With no PR URL, set REVIEW_STATUS to 'REVIEW_BLOCKED' and
                 REVIEW_NEXT_ACTION to 'no PR URL recorded -- find the PR
                 for this branch (gh pr view --json url -q .url, or gh pr
                 list --head <branch> --state all --json url), or create it
                 with gh pr create when none exists, record its URL as a
                 pr:<url> beadRef on the run, then re-invoke with no
                 arguments to resume at Remote Review Disposition (or
                 --abandon the run)'. Skip items 2 and 3 (the skill is not
                 invoked, so there is no ledger and no REVIEW_REPORT_PATH),
                 continue at item 4, which writes the Foreman artifact, and
                 then item 6 (item 5 cannot match REVIEW_BLOCKED), which
                 records approval_wait with that detail and HALTs.
               - With a PR URL, record the PR reference once, regardless of
                 outcome, and only when that exact entry is not already
                 present: call IssueRunIndexStore.mutate(projectRoot,
                 runId, revision, (record) => { if
                 (!record.beadRefs.includes(`pr:${prUrl}`))
                 record.beadRefs.push(`pr:${prUrl}`); }) so a later resume
                 always finds the PR even before a terminal outcome is
                 reached, then continue with item 2.

            2. Invoke the pr-review-cycle skill (via the skill system) with
               MODE='remote', PR_ID=<the SAME repo-slug>-<branch-name> key
               used in Local Review and Batch Fix (never a PR-number form
               -- the review-state report must resolve to the same key so
               the local-phase facts recorded there carry forward),
               PR_URL=<PR_URL from item 1>, HEAD_SHA=<git rev-parse
               HEAD -- the real commit PR Creation pushed>,
               HEAD_TREE_SHA=<git rev-parse 'HEAD^{tree}'>,
               BOT_LOGINS=<configured review-bot usernames>,
               FOREMAN=<--foreman flag>. Pass no reviewed head or tree: the
               skill recovers reviewedHeadSha and reviewedTreeSha from the
               local report recorded under that same PR_ID. PR Creation's
               real commit is not the snapshot commit that report was
               bound to, so the local review is fresh only when HEAD_SHA
               equals the recorded reviewedHeadSha or HEAD_TREE_SHA equals
               the recorded reviewedTreeSha; a different tree means what
               was reviewed is not what was pushed, which is stale
               (REVIEW_PENDING) and never REVIEW_COMPLETE.

            3. Parse the skill's return value {status, localPhase,
               remotePhase, reasons, ledger, nextAction, reportPath,
               headSha}. Store as REVIEW_STATUS, REVIEW_NEXT_ACTION,
               REVIEW_REPORT_PATH.

            4. Foreman artifact -- runs for EVERY status, BEFORE any halt
               below: IF --foreman is set and FOREMAN_ARTIFACT_PATH is
               non-empty: write the phase report { status: REVIEW_STATUS,
               headSha, ledger } to that exact path (creating parent
               directories as needed), in addition to the repo-local
               review-state report pr-review-cycle already wrote at
               REVIEW_REPORT_PATH -- with no prompt and no indefinite
               wait. headSha is the skill's returned headSha or, when the
               skill was not invoked or returned none, `git rev-parse HEAD`;
               ledger is the skill's returned ledger (null when none). If
               FOREMAN_ARTIFACT_PATH is unset, this item's behavior is
               unchanged and no error is raised (TRD-010, AC-013-2,
               AC-013-4). A missing, null or unrecognised REVIEW_STATUS is
               written as 'REVIEW_BLOCKED'.

            5. IF REVIEW_STATUS == 'REVIEW_COMPLETE': do not mutate
               stageOutcome here -- proceed to Record Stage Checkpoint,
               which alone marks the run done.

            6. OTHERWISE -- REVIEW_STATUS is anything other than exactly
               'REVIEW_COMPLETE': that covers REVIEW_PENDING and
               REVIEW_BLOCKED, a null, undefined, empty, lowercase or
               unrecognised value, and a missing or unparseable result.
               It is a blocked outcome, never a pass: never call
               IssueRunIndexStore.complete() and never describe the PR as
               merged or landed. Let HALT_STATUS be REVIEW_STATUS when it
               is exactly 'REVIEW_PENDING' or 'REVIEW_BLOCKED' and
               'REVIEW_BLOCKED' otherwise (so the recorded detail always
               starts with "REVIEW_" and the resume gate finds it). Call
               IssueRunIndexStore.mutate(projectRoot, runId, revision,
               (record) => { record.stageOutcome = { kind: "approval_wait",
               detail: `${HALT_STATUS}: ${REVIEW_NEXT_ACTION ?? 'review
               returned no recognised status'}`, recordedAt: now() }; })
               -- `stage` stays "validation_delivery" so a later bare
               invocation resumes here, not at "done". The Foreman
               artifact (item 4) was already written for this status.
               Print the resumable report (status, next action,
               REVIEW_REPORT_PATH) and HALT -- do NOT proceed to Record
               Stage Checkpoint (TRD-010, AC-012-1, AC-012-2). A finding
               needing a human decision under --foreman is already
               REVIEW_BLOCKED from the skill itself (never dismissed to
               force completion); this branch reports it the same way.

        - order: 5
          title: Record Stage Checkpoint
          description: |
            Persist this phase's outcome and mark the run complete via
            issue-run-index.ts (Implementation AC 2, REQ-019). Only
            reached when Remote Review Disposition's status is
            REVIEW_COMPLETE -- a pending or blocked outcome halts there
            instead (TRD-010, AC-012-1).
          tool: Bash
          instructions: |
            1. Call IssueRunIndexStore.complete(projectRoot, runId) to mark
               the run completed ("done") and release active.lock. The
               run's own history file is never deleted. The PR reference
               was already recorded by Remote Review Disposition.
            2. On a thrown error (e.g. a revision conflict), halt the
               workflow and report the error.

expectedInput:
  description: Issue description or GitHub issue number
  formats:
    - Free text description of the bug or issue
    - GitHub issue number (--issue flag)
  examples:
    - "/ensemble:fix-issue \"Fix timeout bug in auth flow\""
    - "/ensemble:fix-issue --issue 34"
    - "/ensemble:fix-issue \"Fix pagination\" --interactive"
    - "/ensemble:fix-issue --issue 34 --foreman"

expectedOutput:
  format: Pull Request
  structure:
    - name: Git Branch
      description: Feature branch following fix/issue-{num}-{slug} convention
    - name: Code Changes
      description: Implementation fixes with test coverage
    - name: Pull Request
      description: Comprehensive PR with problem, solution, changes, and test plan

validation:
  required_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Grep
    - Glob
    - Task
    - TodoWrite

  required_agents:
    - general-purpose
    - product-management-orchestrator
    - tech-lead-orchestrator
    - infrastructure-orchestrator
    - qa-orchestrator
    - backend-developer
    - frontend-developer
    - infrastructure-developer
    - test-runner
    - git-workflow
    - github-specialist

  required_external:
    - git (version 2.0+)
    - gh (GitHub CLI, authenticated)
