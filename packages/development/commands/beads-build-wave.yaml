metadata:
  name: ensemble:beads-build-wave
  description: Run a single beads-build wave (one work-graph.plan/work-graph.ready schedule + concurrent Task() dispatch + barrier) and emit a JSON summary suitable for the parent loop
  version: 1.3.0
  lastUpdated: "2026-10-23"
  category: implementation
  output_path: ensemble/beads-build-wave.md
  source: sunstone
  model: medium
  argument_hint: "--epic <id> [--max-parallel N] [--trd trd-path] [--strategy tdd|characterization|bug-fix|refactor|test-after|flexible] [--label <label>] [--team-roles <json>] [--foreman]"
  visibility: hidden
  capabilities:
    required:
      - tracker.show
      - tracker.set-status
      - tracker.close
      - tracker.comment
      - work-graph.ready
      - workflow.status
      - workflow.commit
    optional:
      - work-graph.plan
      - tracker.list
      - tracker.sync
  allowed_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - Task

# Skill-backed command: the prompt is packages/development/skills/ensemble-beads-build-wave/SKILL.md,
# the single source of truth. Edit the skill, not this manifest.
skill: ensemble-beads-build-wave
