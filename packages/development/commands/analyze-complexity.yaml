metadata:
  name: ensemble:analyze-complexity
  description: Score work complexity and choose an adaptive Ensemble planning route
  version: 1.0.0
  lastUpdated: "2026-09-02"
  category: planning
  output_path: ensemble/analyze-complexity.md
  source: sunstone
  model: medium
  argument_hint: "[work-description] [--route simple|medium|complex] [--no-adaptive-planning] [--foreman]"

parameters:
  - name: description
    type: string
    required: false
    description: Work description to classify before planning begins
  - name: route
    type: string
    required: false
    description: Override selected route; valid values are simple, medium, complex
  - name: no-adaptive-planning
    type: boolean
    default: false
    description: Skip adaptive classification for this invocation
  - name: foreman
    type: boolean
    default: false
    description: Use FOREMAN_TASK_TITLE and FOREMAN_TASK_DESCRIPTION as the subject/description and write Foreman artifacts when configured

constraints:
  - This command is opt-in; existing direct commands keep their current behavior.
  - Do not infer a missing Foreman subject from repository files, git history, or prior PRDs.
  - Print score, selected route, confidence, and rationale before downstream route side effects.
  - Only route override values simple, medium, and complex are accepted.
  - Preserve original subject/description for downstream command handoff; redact only rationale/audit output.
  - When FOREMAN_ARTIFACT_PATH is set, write the human report exactly there and write a sidecar named with the same basename plus .classification.json.

mission:
  summary: |
    Analyze a user or Foreman work item before planning starts. Normalize input,
    redact likely secrets in audit text, compute deterministic complexity scores
    for scope size, dependencies, risk factors, and team size, map the final
    score to Simple/Medium/Complex planning depth, apply explicit overrides,
    and disclose the selected route before invoking or instructing downstream
    Ensemble commands.
  behavior:
    - Accept free-text descriptions in interactive mode.
    - In Foreman mode, prefer FOREMAN_TASK_TITLE and FOREMAN_TASK_DESCRIPTION over arguments.
    - Halt on missing subject with no route side effects.
    - Support adaptive_planning.enabled false config and --no-adaptive-planning precedence.
    - Map scores 1-3 to Simple, 4-6 to Medium, and 7-10 to Complex.
    - Use deterministic fallback when model output is malformed and enough non-secret structural evidence exists.
    - Ask for confirmation or clarification on low-confidence interactive analysis before dispatch.
    - In low-confidence Foreman mode, choose the safer higher-depth plausible route and record missing details.

workflow:
  phases:
    - name: Input Normalization
      order: 1
      steps:
        - order: 1
          title: Resolve subject and description
          description: |
            Resolve COMPLEXITY_ANALYZER per the tool-path-resolution skill (packages/development/skills/tool-path-resolution/SKILL.md) for packages/development/lib/complexity-analyzer.js. If none of the 4 tiers resolve OR 'which node' fails: print 'ERROR: Node.js and the complexity analyzer (lib/complexity-analyzer.js) are required for deterministic complexity scoring. Ensure Node.js is installed and the ensemble-development plugin is present.' and exit 1.
            Run node "$COMPLEXITY_ANALYZER" analyze with the provided arguments.
            If --foreman is present, read FOREMAN_TASK_TITLE as the subject and FOREMAN_TASK_DESCRIPTION as the description.
            If no subject or description exists, print the missing-subject error and stop before creating any downstream artifact.
        - order: 2
          title: Resolve adaptive planning controls
          description: |
            Apply --no-adaptive-planning first. If absent, read Ensemble config files for adaptive_planning.enabled.
            When disabled, print that adaptive planning was skipped and leave existing direct command behavior unchanged.

    - name: Complexity Scoring
      order: 2
      steps:
        - order: 1
          title: Redact audit text
          description: |
            Redact likely secrets such as API keys, tokens, passwords, and bearer tokens before rationale or report output.
            Preserve the original subject and description for downstream route payloads.
        - order: 2
          title: Score required dimensions
          description: |
            Compute numeric and qualitative scores for scope size, dependencies, risk factors, and team size.
            Include concrete evidence per elevated dimension in the rationale.
        - order: 3
          title: Map score to route
          description: |
            Use inclusive score bands: 1-3 Simple, 4-6 Medium, 7-10 Complex.
            Simple points to /ensemble:fix-issue, Medium points to PRD/TRD planning then stops, and Complex includes PRD/TRD refinement gates then stops before implementation.
        - order: 4
          title: Confidence and fallback handling
          description: |
            Mark confidence low when fewer than two dimensions have scoreable evidence.
            If AI output is malformed, use deterministic heuristic fallback only when enough structural detail exists; otherwise halt with no side effects.
            In low-confidence Foreman mode, select a safer higher-depth plausible route and record missing details.

    - name: Route Selection and Disclosure
      order: 3
      steps:
        - order: 1
          title: Apply route override
          description: |
            Accept only --route simple, --route medium, or --route complex.
            Preserve the recommended route and record the selected override source.
            Reject any other override value with valid choices listed and no route side effects.
        - order: 2
          title: Print pre-planning disclosure
          description: |
            Print score, route, confidence, override status, dimension detail, and rationale before downstream dispatch text.
            In interactive low-confidence mode, request clarification or explicit confirmation before route execution.
        - order: 3
          title: Emit Foreman artifacts
          description: |
            When --foreman and FOREMAN_ARTIFACT_PATH are set, write the human-readable phase report to exactly FOREMAN_ARTIFACT_PATH and a JSON sidecar named <basename>.classification.json next to it.

    - name: Downstream Route Contract
      order: 4
      steps:
        - order: 1
          title: Simple route
          description: |
            Invoke or instruct /ensemble:fix-issue with the original non-redacted work description.
        - order: 2
          title: Medium route
          description: |
            Invoke or instruct /ensemble:create-prd followed by /ensemble:create-trd, then stop before implementation until explicit approval.
        - order: 3
          title: Complex route
          description: |
            Invoke or instruct /ensemble:create-prd, /ensemble:refine-prd, /ensemble:create-trd, and /ensemble:refine-trd, then stop before implementation until explicit approval.

expectedInput:
  format: Work description or Foreman task metadata
  sections:
    - name: Work item
      required: true
      description: Free-text subject/description from command args or Foreman metadata

expectedOutput:
  format: Complexity disclosure and optional Foreman artifacts
  structure:
    - name: Score disclosure
      description: Score, selected route, recommended route, confidence, override state, and rationale
    - name: Route plan
      description: Downstream Ensemble command sequence and approval stop state
    - name: Foreman classification sidecar
      description: Machine-readable JSON written adjacent to FOREMAN_ARTIFACT_PATH in Foreman mode
