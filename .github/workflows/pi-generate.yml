name: Pi Generate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 (full history) is required so scripts/bump-pi-version-if-changed.js
      # (invoked via the postgenerate:pi hook during "Generate Pi artifacts" below) can
      # compute a real merge-base against origin/main. With the default shallow (depth 1)
      # checkout, that merge-base lookup fails and the script no-ops (by design, so it
      # never hard-fails a build over missing history) -- which would silently defeat the
      # version-drift check two steps down.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build packages/pi
        run: npm run build --workspace=packages/pi

      # PI-CI-001: Generate Pi artifacts from source
      - name: Generate Pi artifacts
        run: npm run generate:pi

      # PI-CI-002: Drift detection - fail if generated artifacts (or the
      # package's declared version) differ from committed versions
      #
      # Guards packages/pi/prompts, the Pi command output directory. Pi loads
      # commands from prompts/ (native pi ignores commands/), so each command is
      # emitted exactly once as prompts/ensemble-<cmd>.md. There are no
      # gitignored colon-namespaced files any more; every generated prompt is
      # committed and compared here.
      #
      # packages/pi/package.json and packages/pi/.claude-plugin/plugin.json are
      # also included: `npm run generate:pi` above runs the postgenerate:pi hook
      # (scripts/bump-pi-version-if-changed.js), which auto-bumps the patch
      # version when content changed since origin/main and nobody manually
      # bumped it. If that produces a diff here, the contributor forgot to run
      # `npm run generate:pi` locally and commit its full output (including the
      # version bump) -- without this, a version bump could be silently missed
      # and `pi install` would gate on an unchanged version, serving stale
      # content forever.
      - name: Check for stale generated output
        run: |
          PATHS="packages/pi/prompts packages/pi/agents packages/pi/skills packages/pi/AGENTS.md packages/pi/package.json packages/pi/.claude-plugin/plugin.json"
          git diff --exit-code $PATHS || {
            echo "ERROR: Generated Pi artifacts (or version files) are stale. Run 'npm run generate:pi' and commit the results (including the version bump)."
            echo "If you already did and still see this: your packages/pi/dist/ was a stale local build. dist/ is gitignored and 'generate' now builds first, so re-run on an up-to-date checkout."
            echo ""
            echo "Changed files:"
            git diff --name-only $PATHS
            exit 1
          }
          echo "Pi generated output is up to date."
