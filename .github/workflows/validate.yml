name: Validate Plugins

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Filenames containing ':' are legal on Linux (where CI runs) but illegal
      # on NTFS. Committing one makes the whole repo impossible to check out on
      # Windows — including the marketplace clone Claude Code keeps under
      # ~/.claude/plugins/marketplaces/, which breaks plugin installation for
      # every Windows user. This is cheap insurance against re-breaking that.
      - name: Reject Windows-invalid filenames
        run: |
          if bad=$(git ls-files | grep ':'); then
            echo "::error::Tracked paths contain ':', which cannot exist on Windows (NTFS):"
            echo "$bad"
            exit 1
          fi
          echo "No Windows-invalid tracked filenames."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # scripts/ is not an npm workspace, so `npm test` (which runs
      # --workspaces) never reaches these. Without this step the Windows
      # glob-pattern regression test would never actually run.
      - name: Test build scripts
        run: npx jest scripts/tests

      # Replaces the hand-rolled steps this job used to run. scripts/validate-all.js
      # is a strict superset of them (marketplace.json and every plugin.json against
      # their schemas, agent YAML syntax, @sunstone-partners/ensemble-* package naming), and
      # `npm run validate` additionally enforces manifest version sync and model
      # IDs. The old steps never checked versions at all, which is how six packages
      # drifted unnoticed. The separate OpenCode plugin.json step was redundant:
      # validate-all.js iterates every package, including opencode.
      - name: Validate
        run: npm run validate

      # Generated .md must match its .yaml source. `npm run generate:validate`
      # only schema-checks the YAML and never compares against what is on disk,
      # so stale generated markdown was caught nowhere -- configure-team.md sat
      # stale on main because of it.
      - name: Check generated markdown is up to date
        run: |
          npm run generate
          git diff --exit-code -- 'packages/**/*.md' || {
            echo "::error::Generated markdown is stale. Run 'npm run generate' and commit the result."
            exit 1
          }

      - name: Check package.json consistency
        run: |
          for pkg in packages/*/package.json; do
            if [ -f "$pkg" ]; then
              echo "Checking $pkg"
              node -e "const p = require('./$pkg'); if (!p.name.startsWith('@sunstone-partners/ensemble-')) process.exit(1);"
            fi
          done

      - name: Validate OpenCode plugin.json
        run: |
          OPENCODE_PLUGIN="packages/opencode/.claude-plugin/plugin.json"
          if [ -f "$OPENCODE_PLUGIN" ]; then
            echo "Validating $OPENCODE_PLUGIN"
            npx ajv validate -s schemas/plugin-schema.json -d "$OPENCODE_PLUGIN" -c ajv-formats
          else
            echo "WARNING: packages/opencode/.claude-plugin/plugin.json not found"
          fi
